<mat-card class="login-mat-card">
  <mat-card-header>
    <mat-toolbar class="login-title">
      <mat-toolbar-row>
        <span>Login</span>
      </mat-toolbar-row>
    </mat-toolbar>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="row mt-2">
        <mat-form-field class="col">
          <mat-label>Username</mat-label>
          <input type="text" matInput placeholder="username" [formControl]="username">
          @if (username.hasError('required')) {
          <mat-error>username is <strong>required</strong></mat-error>
          }
        </mat-form-field>
      </div>
      <div class="row mt-2">
        <mat-form-field class="col">
          <mat-label>password</mat-label>
          <input type="password" matInput placeholder="password" [formControl]="password">
          @if (password.hasError('required')) {
          <mat-error>password is <strong>required</strong></mat-error>
          }
        </mat-form-field>
      </div>
      <div class="row mt-2">
        <button type="submit" class="ml-3" style="width: 100px" mat-raised-button color="accent"
          [disabled]="!loginForm.valid"> Login</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
